# lldb — distributed analytical query engine (workspace root)
#
# Version discipline (verified against crates.io 2026-07-23):
#   - iceberg-datafusion 0.10 caps datafusion at ^53.1  → datafusion = 53.1
#   - datafusion 53.1 pins arrow ^58.0.0 + object_store ^0.13.1
#   - arrow / arrow-flight / parquet MUST share ONE version across the tree (Flight boundary)
# Bumping DataFusion to 54 becomes possible once iceberg-datafusion rebases forward.

[workspace]
resolver = "3"
members = [
    "crates/lldb-qe-admin",
    "crates/lldb-qe-control",
    "crates/lldb-qe-core",
    "crates/lldb-qe-coordinator",
    "crates/lldb-qe-types",
    "crates/lldb-qe-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/lafollett-labs/lldb"
authors = ["Cali LaFollett <cali.lafollett@gmail.com>"]
description = "A distributed analytical query engine (DataFusion + Arrow Flight + Iceberg)."

[workspace.dependencies]
# --- DataFusion query engine (capped by iceberg-datafusion 0.10) ---
datafusion = "53.1"
datafusion-proto = "53.1"

# --- Apache Iceberg table format ---
iceberg = "0.10"
iceberg-datafusion = "0.10"
# The persistent, shareable catalog (issue #8). Depends only on iceberg 0.10, sqlx ^0.8.1,
# async-trait and strum — no second arrow / object_store / datafusion enters the tree.
iceberg-catalog-sql = "0.10"

# --- Arrow family: ONE version everywhere; Flight (de)serialization requires it ---
arrow = "58.4"
arrow-flight = "58.4"
parquet = "58.4"

# --- Storage abstraction: MUST match datafusion 53.1's pin (object_store ^0.13.1) ---
# `aws` feature pulls in the S3 backend so `StorageConfig::S3` can address real buckets.
object_store = { version = "0.13", features = ["aws"] }

# --- CLI parsing (binaries + shared config args) ---
clap = { version = "4", features = ["derive", "env"] }

# --- Async runtime + gRPC transport ---
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
# `tls-ring` is tonic 0.14's spelling of "TLS via rustls, backed by *ring*" — 0.12's plain `tls`
# feature is gone, and the two successors name their crypto backend (`tls-ring` / `tls-aws-lc`).
# Ring is the one to pick here and the choice is forced rather than aesthetic: `ring` is already in
# the tree (object_store → reqwest → hyper-rustls, and sqlx's `tls-rustls`) and `aws-lc-rs` is not,
# so `tls-ring` reuses the single `rustls 0.23` copy and adds no second version of anything.
# `tls-aws-lc` would add a whole second crypto stack, which the one-version-tree-wide rule in
# CLAUDE.md forbids. Deliberately NOT `tls-native-roots` / `tls-webpki-roots`: this fleet verifies
# against a CA file the deployment mounts (`--tls-ca`), so a bundled trust store would be a
# dependency bought for nothing. See crates/lldb-qe-control/src/tls.rs.
tonic = { version = "0.14", features = ["tls-ring"] }
futures = "0.3"

# The crypto provider behind that TLS, named explicitly. rustls 0.23 resolves its provider from
# crate features when nothing has installed one, which works today only because `ring` is the sole
# provider in the tree — the day a dependency adds `aws-lc-rs`, the fallback becomes ambiguous and
# `ServerConfig::builder()` PANICS inside a handshake. Depending on rustls directly lets
# `tls::install_crypto_provider` install ring once, at startup, so that day turns into a no-op
# instead of an outage. Already at 0.23.42 in the tree via hyper-rustls/sqlx; `default-features =
# false` keeps `aws-lc-rs` (a rustls *default* feature) from being unioned in by this line.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# --- Services DB (metadata/catalog/accounts): pinned to sqlx 0.8 because
# `iceberg-catalog-sql` 0.10 (issue #8) depends on sqlx ^0.8.1 — one sqlx tree-wide.
#
# `macros` is on because `sqlx::migrate!` lives behind it — that is what embeds the SQL in
# `crates/lldb-qe-control/migrations/` into the binary at compile time, so an image carries its own
# schema. It does NOT mean we use the compile-time-checked `query!` family: those need a live
# database at build time, which would break `cargo build` in CI and in Docker.
#
# `any` is on because `iceberg-catalog-sql` drives its catalog tables through sqlx's `Any`
# driver and calls `install_default_drivers()` itself. That call can only register drivers that
# were *compiled in*, so the `postgres` feature above is what makes a `postgres://` catalog URI
# resolvable at all — and is why the SQL catalog speaks Postgres and nothing else in this build.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "any", "migrate", "macros", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# --- Credentials & access control (issue #19) ---
# Every one of these is ALREADY in the dependency tree via datafusion / iceberg / sqlx, so
# declaring them directly adds no new version of anything — verified by diffing `cargo tree -d`
# before and after. That check is the rule, not a courtesy: this workspace's whole build story is
# "one arrow / object_store / datafusion tree-wide" (see CLAUDE.md), and a credential crate is
# exactly the kind of small, tempting dependency that quietly drags in a second one.
#
# rand is pinned to 0.9 deliberately: 0.8 and 0.10 are both in the tree transitively, and picking
# the one datafusion/iceberg already resolve to is what keeps the duplicate count unchanged.
sha2 = "0.10"      # hash an API token (NOT a KDF — see crates/lldb-qe-control/src/auth.rs)
# HMAC-SHA256 over the same `digest` traits sha2 already implements, so it adds no second hash
# implementation and no second `digest` — verified with `cargo tree -d`, which must keep reporting
# ZERO duplicates of arrow, datafusion, object_store and iceberg. That per-crate claim is the rule
# CLAUDE.md actually imposes, and `scripts/check-dep-dupes.sh` enforces it in CI. A raw duplicate
# total is deliberately NOT recorded here. It drifts with every unrelated crate, and it is not even
# a well-defined number: `cargo tree -d` today prints 59 entries covering 27 distinct crate names,
# and lists some crates twice at the SAME version, so "48 duplicated crates" (the figure this
# comment used to carry) cannot be compared against it without knowing which was counted. A
# contributor who finds it stale stops trusting the check it was meant to justify.
# It signs the per-request plan assertion the worker boundary checks; see
# crates/lldb-qe-core/src/plan_assertion.rs for why that is a MAC keyed by the fleet secret and
# not a signature. Hand-rolling HMAC over sha2 was the alternative: 20 lines, no dependency, and
# no reason to prefer a fresh implementation of a specified construction over the audited one.
hmac = "0.12"
subtle = "2.6"     # constant-time comparison of digests and of the fleet secret
hex = "0.4"        # render the digest for storage
rand = "0.9"       # 32 bytes of CSPRNG per token
base64 = "0.22"    # URL-safe token encoding

# Ed25519 for the plan assertion's asymmetric half (#127), and deliberately NOT a new crypto stack:
# `ring` is already in this tree via `object_store` and rustls, at one version, and it is the
# provider `tls.rs` *installs* rather than infers — precisely so a future dependency pulling
# `aws-lc-rs` cannot panic the process. Signing with the provider already chosen keeps that argument
# intact; `ed25519-dalek` would be a second implementation of the same primitive for no gain.
ring = "0.17"

# --- Errors, logging, small utils ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# --- Config-as-data: schemas/catalogs declared in a manifest, not in code ---
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# --- Benchmarking + test utilities (dev) ---
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3"
# A self-signed certificate, minted per test run, so the TLS tests need no committed key material.
# A checked-in PEM private key would be a secret in git — flagged by every scanner, blocked by
# GitHub push protection, and a lie about what a private key is — and an `openssl` shell-out would
# make the test suite depend on a binary that is not in the toolchain.
#
# `default-features = false` + `ring` is NOT cosmetic: rcgen 0.14 defaults to **aws-lc-rs**, which
# would put a second crypto provider in the tree. That breaks the one-version rule in CLAUDE.md and,
# worse, makes rustls's provider inference ambiguous — turning `ServerConfig::builder()` into a
# panic in exactly the tests that exercise TLS. Verified the same way as the credential crates
# above: no duplicate of the four pinned crates, before or after. Dev-only; no binary links it.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.dev]
# This workspace's debug build is enormous, and that is a property of the dependency tree rather
# than of anything we wrote: DataFusion, Arrow, the Iceberg stack and sqlx are all large, and the
# "ONE arrow / object_store / datafusion version tree-wide" rule above means none of it dedupes
# away. With default settings `cargo build --all-targets` produces roughly 30 GB of artifacts —
# enough to exhaust a CI runner's or a container's disk allowance mid-build and fail the run for a
# reason that looks nothing like its cause. These two keys take it to about 9 GB.
#
# `debug = 0` drops debuginfo, which is what almost all of that 30 GB actually is. The cost is
# line numbers in panic backtraces; if you are chasing one, `debug = "line-tables-only"` buys them
# back for a fraction of the full size. It is not the default because the common case is running
# the test suite, not debugging it.
#
# `incremental = false` because incremental state is a second large on-disk cache that pays off
# only across repeated local edits — and never in CI, a container, or a fresh worktree, which is
# where the disk ceiling is actually hit.
#
# `[profile.test]` inherits from this, so tests get both.
debug = 0
incremental = false

[profile.release]
# Analytical engines live and die on the optimizer; make release builds honest.
lto = "thin"
codegen-units = 1
